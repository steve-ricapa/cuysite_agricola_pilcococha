<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/fundo/logopilcococha.png" />
    <link rel="shortcut icon" href="/images/fundo/logopilcococha.png" />
    <link rel="apple-touch-icon" href="/images/fundo/logopilcococha.png" />
    <title>Agrícola Pilcococha | Palta Hass Peruana de Exportación</title>
    <meta name="description" content="Cultivo y exportación de Palta Hass peruana con los más altos estándares de calidad internacional, trazabilidad y manejo agrícola sostenible desde nuestros fundos." />
    
    <!-- Google Fonts: Fraunces & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #boot-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#0E2C20;overflow:hidden;transition:opacity .5s ease}
      #boot-loader.is-leaving{opacity:0;pointer-events:none}
      /* Luz blanca difusa detrás del logo: sin forma, sin borde, sin óvalo */
      #boot-loader .boot-glow{position:relative;display:flex;align-items:center;justify-content:center}
      #boot-loader .boot-glow::before{content:"";position:absolute;left:50%;top:50%;width:min(560px,150vw);height:250px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,255,255,.98),rgba(255,255,255,.55) 42%,rgba(255,255,255,0) 72%);animation:boot-light 2.4s ease-in-out infinite;pointer-events:none}
      #boot-loader .boot-glow img{position:relative;display:block;height:64px;width:auto;animation:boot-float 2.4s ease-in-out infinite}
      #boot-loader .boot-bar{position:relative;width:190px;height:3px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
      #boot-loader .boot-bar span{display:block;width:42%;height:100%;border-radius:999px;background:#9AB55D;animation:boot-slide 1.1s ease-in-out infinite}
      @keyframes boot-light{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
      @keyframes boot-float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
      @keyframes boot-slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
      @media (prefers-reduced-motion: reduce){#boot-loader .boot-glow::before,#boot-loader .boot-glow img{animation:none}#boot-loader .boot-bar span{animation:none;width:100%}}
    </style>
  </head>
  <body class="bg-cream text-charcoal font-sans antialiased selection:bg-forest-800 selection:text-white">
    <div id="root"></div>

    <!-- Cortina de carga: se pinta antes de descargar el bundle y la retira React con "pilcococha:ready" -->
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-glow">
        <img src="/images/fundo/logopilcococha.png" alt="" />
      </div>
      <div class="boot-bar"><span></span></div>
    </div>
    <noscript><style>#boot-loader{display:none!important}</style></noscript>
    <script>
      (function () {
        var loader = document.getElementById('boot-loader');
        if (!loader) return;
        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          loader.classList.add('is-leaving');
          window.setTimeout(function () { loader.remove(); }, 520);
        }
        window.addEventListener('pilcococha:ready', hide);
        // Red de seguridad: si React nunca arranca, la cortina no se queda pegada.
        window.setTimeout(hide, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
